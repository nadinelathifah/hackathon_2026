<style>
/* ==========================================================================
   Ibex Credit — Design Tokens
   Mirrors the Figma Foundations page: primitives → semantic tokens
   ========================================================================== */

:root {
  /* --- Primitives: Forest (brand) --- */
  --forest-50:  #EBFFF5;
  --forest-100: #D4EEE4;
  --forest-300: #5FA98C;
  --forest-500: #1B5C46;
  --forest-600: #124A38;
  --forest-700: #0B3D2E;
  --forest-900: #0B2A20;

  /* --- Primitives: Lime (accent) --- */
  --lime-50:  #F5FFE0;
  --lime-100: #EAFFC2;
  --lime-300: #DFFF9E;
  --lime-500: #D0FF71;
  --lime-600: #B9E85E;
  --lime-700: #A0CC4A;

  /* --- Primitives: Blue (links/focus) --- */
  --blue-50:  #EAF0FF;
  --blue-500: #4C7EFF;
  --blue-600: #3A63D9;

  /* --- Primitives: Gray --- */
  --gray-50:  #F9FAFB;
  --gray-100: #F3F4F6;
  --gray-200: #E5E7EB;
  --gray-300: #D1D5DB;
  --gray-400: #9CA3AF;
  --gray-500: #6B7280;
  --gray-600: #4B5563;
  --gray-700: #374151;
  --gray-800: #1F2937;
  --gray-900: #111827;

  /* --- Primitives: Status --- */
  --green-50: #ECFDF5; --green-100: #D1FAE5; --green-500: #10B981; --green-600: #059669; --green-700: #047857;
  --amber-50: #FFFBEB; --amber-100: #FEF3C7; --amber-500: #F59E0B; --amber-600: #D97706; --amber-700: #B45309;
  --red-50:   #FEF2F2; --red-100:   #FEE2E2; --red-500:   #EF4444; --red-600:   #DC2626; --red-700:   #B91C1C;

  --white: #FFFFFF;
  --black: #000000;

  /* --- Semantic: Background --- */
  --bg-default: var(--white);
  --bg-subtle: var(--gray-50);
  --bg-muted: var(--gray-100);
  --bg-inverse: var(--forest-900);
  --bg-brand: var(--forest-700);
  --bg-brand-subtle: var(--forest-50);
  --bg-accent: var(--lime-500);
  --bg-accent-subtle: var(--lime-50);

  /* --- Semantic: Text --- */
  --text-primary: var(--gray-900);
  --text-secondary: var(--gray-500);
  --text-disabled: var(--gray-400);
  --text-inverse: var(--white);
  --text-brand: var(--forest-600);
  --text-link: var(--blue-500);

  /* --- Semantic: Border --- */
  --border-default: var(--gray-200);
  --border-strong: var(--gray-300);
  --border-brand: var(--forest-500);
  --border-focus: var(--blue-500);

  /* --- Semantic: Icon --- */
  --icon-default: var(--gray-600);
  --icon-inverse: var(--white);
  --icon-brand: var(--forest-600);

  /* --- Semantic: Credential status --- */
  --status-verified-bg: var(--green-50);   --status-verified-text: var(--green-700);  --status-verified-icon: var(--green-600);  --status-verified-border: var(--green-100);
  --status-pending-bg: var(--amber-50);    --status-pending-text: var(--amber-700);   --status-pending-icon: var(--amber-600);   --status-pending-border: var(--amber-100);
  --status-rejected-bg: var(--red-50);     --status-rejected-text: var(--red-700);    --status-rejected-icon: var(--red-600);    --status-rejected-border: var(--red-100);
  --status-expired-bg: var(--gray-100);    --status-expired-text: var(--gray-600);    --status-expired-icon: var(--gray-500);    --status-expired-border: var(--gray-300);

  /* --- Spacing scale --- */
  --spacing-2xs: 2px;
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;
  --spacing-3xl: 64px;

  /* --- Radius scale --- */
  --radius-none: 0px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-full: 9999px;

  /* --- Typography --- */
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* --- Elevation --- */
  --shadow-subtle: 0 1px 2px rgba(0,0,0,0.06);
  --shadow-card: 0 2px 4px -1px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-raised: 0 8px 16px -4px rgba(0,0,0,0.10), 0 2px 6px -1px rgba(0,0,0,0.05);
  --shadow-modal: 0 20px 32px -8px rgba(0,0,0,0.16), 0 4px 8px -2px rgba(0,0,0,0.08);
}
/* ==========================================================================
   Ibex Credit — Component Library
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-family);
  color: var(--text-primary);
  background: var(--bg-subtle);
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

/* Visible focus ring everywhere (accessibility floor) */
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--border-focus);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* --- Typography scale --- */
.display-hero { font-size: 56px; line-height: 64px; font-weight: 700; letter-spacing: -1px; }
.h1 { font-size: 36px; line-height: 44px; font-weight: 700; letter-spacing: -0.5px; margin: 0; }
.h2 { font-size: 28px; line-height: 36px; font-weight: 700; margin: 0; }
.h3 { font-size: 22px; line-height: 28px; font-weight: 600; margin: 0; }
.h4 { font-size: 18px; line-height: 24px; font-weight: 600; margin: 0; }
.body-lg { font-size: 16px; line-height: 24px; font-weight: 400; }
.body-md { font-size: 14px; line-height: 20px; font-weight: 400; }
.body-sm { font-size: 12px; line-height: 16px; font-weight: 400; }
.label-lg { font-size: 14px; line-height: 20px; font-weight: 500; }
.label-md { font-size: 12px; line-height: 16px; font-weight: 500; }
.label-sm { font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; }

/* ==========================================================================
   Button
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xs);
  font-family: var(--font-family);
  font-weight: 500;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  white-space: nowrap;
}
.btn-medium { padding: var(--spacing-sm) var(--spacing-md); font-size: 14px; }
.btn-large { padding: var(--spacing-md) var(--spacing-lg); font-size: 16px; }
.btn-full { width: 100%; }

.btn-primary { background: var(--bg-brand); color: var(--text-inverse); }
.btn-primary:hover { background: var(--forest-600); }
.btn-primary:disabled { background: var(--bg-muted); color: var(--text-disabled); cursor: not-allowed; }

.btn-secondary { background: var(--bg-brand-subtle); color: var(--text-brand); border: 1.5px solid var(--border-brand); }
.btn-secondary:hover { background: var(--forest-100); }
.btn-secondary:disabled { background: var(--bg-muted); color: var(--text-disabled); border-color: var(--border-default); cursor: not-allowed; }

.btn-ghost { background: transparent; color: var(--text-brand); }
.btn-ghost:hover { background: var(--lime-50); }
.btn-ghost:disabled { color: var(--text-disabled); cursor: not-allowed; }

.btn-danger-outline { background: transparent; color: var(--status-rejected-text); border: 1.5px solid var(--status-rejected-border); }
.btn-danger-outline:hover { background: var(--status-rejected-bg); }

/* ==========================================================================
   Badge
   ========================================================================== */
.badge {
  display: inline-flex;
  align-items: center;
  border-radius: var(--radius-full);
  font-weight: 600;
  white-space: nowrap;
}
.badge-small { padding: var(--spacing-2xs) var(--spacing-sm); font-size: 11px; }
.badge-medium { padding: var(--spacing-xs) var(--spacing-md); font-size: 12px; }
.badge-neutral { background: var(--bg-muted); color: var(--text-secondary); }
.badge-brand { background: var(--bg-brand-subtle); color: var(--text-brand); }
.badge-success { background: var(--status-verified-bg); color: var(--status-verified-text); }
.badge-warning { background: var(--status-pending-bg); color: var(--status-pending-text); }
.badge-error { background: var(--status-rejected-bg); color: var(--status-rejected-text); }

/* ==========================================================================
   Verified Seal
   ========================================================================== */
.seal {
  --seal-color: var(--status-verified-icon);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--seal-color);
  flex-shrink: 0;
  clip-path: polygon(
    50% 0%, 61% 7%, 73% 2%, 80% 13%, 93% 13%, 95% 26%,
    100% 35%, 92% 44%, 100% 53%, 92% 62%, 100% 71%, 93% 79%,
    93% 87%, 80% 87%, 73% 98%, 61% 93%, 50% 100%, 39% 93%,
    27% 98%, 20% 87%, 7% 87%, 7% 79%, 0% 71%, 8% 62%,
    0% 53%, 8% 44%, 0% 35%, 5% 26%, 7% 13%, 20% 13%, 27% 2%, 39% 7%
  );
}
.seal svg { width: 46%; height: 46%; }
.seal-small { width: 32px; height: 32px; }
.seal-medium { width: 48px; height: 48px; }
.seal-large { width: 72px; height: 72px; }
.seal-pending { --seal-color: var(--status-pending-icon); }
.seal-rejected { --seal-color: var(--status-rejected-icon); }
.seal-expired { --seal-color: var(--status-expired-icon); }

/* ==========================================================================
   Avatar
   ========================================================================== */
.avatar {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--bg-brand);
  color: var(--text-inverse);
  font-weight: 600;
  flex-shrink: 0;
}
.avatar-small { width: 24px; height: 24px; font-size: 10px; }
.avatar-medium { width: 32px; height: 32px; font-size: 12px; }
.avatar-large { width: 48px; height: 48px; font-size: 18px; }
.avatar-status {
  position: absolute;
  bottom: -1px; right: -1px;
  width: 32%; height: 32%;
  border-radius: 50%;
  background: var(--status-verified-icon);
  border: 2px solid var(--bg-default);
}

/* ==========================================================================
   Card
   ========================================================================== */
.card {
  background: var(--bg-default);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border-default);
  box-shadow: var(--shadow-card);
  padding: var(--spacing-xl);
}
.card-elevated { border: none; box-shadow: var(--shadow-raised); }
.card-inverse { background: var(--bg-inverse); border: none; }

/* ==========================================================================
   Input
   ========================================================================== */
.field { display: flex; flex-direction: column; gap: var(--spacing-xs); }
.field-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
.field-input {
  font-family: var(--font-family);
  font-size: 14px;
  color: var(--text-primary);
  background: var(--bg-default);
  border: 1.5px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: var(--spacing-sm) var(--spacing-md);
  width: 100%;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.field-input::placeholder { color: var(--text-disabled); }
.field-input:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(76,126,255,0.15); }
.field-input.error { border-color: var(--status-rejected-border); }
.field-input:disabled { background: var(--bg-muted); color: var(--text-disabled); cursor: not-allowed; }
.field-helper { font-size: 12px; color: var(--text-secondary); }
.field-helper.error { color: var(--status-rejected-text); }

/* ==========================================================================
   Toggle
   ========================================================================== */
.toggle {
  position: relative;
  display: inline-block;
  width: 40px; height: 22px;
  cursor: pointer;
}
.toggle input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.toggle-track {
  position: absolute; inset: 0;
  background: var(--gray-300);
  border-radius: var(--radius-full);
  transition: background-color 0.15s ease;
}
.toggle-thumb {
  position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px;
  background: var(--bg-default);
  border-radius: 50%;
  box-shadow: var(--shadow-subtle);
  transition: transform 0.15s ease;
}
.toggle input:checked + .toggle-track { background: var(--bg-brand); }
.toggle input:checked + .toggle-track .toggle-thumb { transform: translateX(18px); }
.toggle input:checked ~ .toggle-thumb { transform: translateX(18px); }
.toggle input:disabled + .toggle-track { opacity: 0.45; cursor: not-allowed; }

/* ==========================================================================
   Nav
   ========================================================================== */
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-md) var(--spacing-2xl);
  background: var(--bg-inverse);
}
.nav-logo { display: flex; align-items: center; gap: var(--spacing-sm); }
.nav-logo-mark {
  width: 28px; height: 28px;
  border-radius: var(--radius-sm);
  background: var(--bg-brand);
  display: flex; align-items: center; justify-content: center;
}
.nav-logo-text { font-weight: 700; font-size: 18px; color: var(--text-inverse); }
.nav-links { display: flex; align-items: center; gap: var(--spacing-lg); }
.nav-link { font-size: 14px; font-weight: 500; color: var(--text-inverse); opacity: 0.65; transition: opacity 0.15s ease; }
.nav-link:hover, .nav-link.active { opacity: 1; }
.nav-link.active { color: var(--lime-500); opacity: 1; }
.nav-hamburger { display: none; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 4px; }
.nav-hamburger span { width: 20px; height: 2px; background: var(--text-inverse); border-radius: 1px; }

/* ==========================================================================
   Decorative background blobs
   ========================================================================== */
.blob-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); }
.blob-lime { background: var(--lime-500); opacity: 0.12; }
.blob-blue { background: var(--blue-500); opacity: 0.10; }

/* ==========================================================================
   Utility
   ========================================================================== */
.flex { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-xs { gap: var(--spacing-xs); } .gap-sm { gap: var(--spacing-sm); } .gap-md { gap: var(--spacing-md); }
.gap-lg { gap: var(--spacing-lg); } .gap-xl { gap: var(--spacing-xl); }
.text-secondary { color: var(--text-secondary); }
.text-brand { color: var(--text-brand); }
.text-link { color: var(--text-link); }
.divider { height: 1px; background: var(--border-default); border: none; margin: 0; width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
/* ==========================================================================
   Ibex Credit — Page Layout & Responsive Rules
   Breakpoint convention: desktop-first, collapsing at 860px (tablet/mobile)
   ========================================================================== */

.page { min-height: 100vh; background: var(--bg-subtle); }
.page-body {
  max-width: 680px;
  margin: 0 auto;
  padding: var(--spacing-2xl) var(--spacing-lg);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-xl);
}
.page-body-wide { max-width: 1040px; }
.page-body-narrow { max-width: 560px; }

/* Hero split layout (auth screens) */
.split-hero {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.split-hero-panel {
  background: var(--bg-inverse);
  color: var(--text-inverse);
  padding: var(--spacing-3xl);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: var(--spacing-xl);
}
.split-hero-form {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--spacing-3xl);
}

/* Grid of option/profile cards */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--spacing-md);
}

/* Two-column dashboard layout */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr 1.6fr;
  gap: var(--spacing-lg);
  align-items: start;
}

.stat-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: var(--spacing-sm);
}

/* ==========================================================================
   Responsive — collapses to mobile-web pattern at 860px
   ========================================================================== */
@media (max-width: 860px) {
  .nav { padding: var(--spacing-md) var(--spacing-lg); }
  .nav-links { display: none; }
  .nav-links.nav-links-open {
    display: flex;
    flex-direction: column;
    position: absolute;
    top: 60px; left: 0; right: 0;
    background: var(--bg-inverse);
    padding: var(--spacing-md) var(--spacing-lg);
    gap: var(--spacing-md);
    z-index: 20;
    box-shadow: var(--shadow-modal);
  }
  .nav { position: relative; }
  .nav-hamburger { display: flex; }

  .page-body { padding: var(--spacing-lg); gap: var(--spacing-lg); }

  .split-hero { grid-template-columns: 1fr; min-height: auto; }
  .split-hero-panel { padding: var(--spacing-xl) var(--spacing-lg); text-align: left; }
  .split-hero-form { padding: var(--spacing-xl) var(--spacing-lg); }

  .card-grid { grid-template-columns: 1fr; }
  .dashboard-grid { grid-template-columns: 1fr; }
  .stat-row { grid-template-columns: repeat(2, 1fr); }

  .h1 { font-size: 28px; line-height: 34px; }
  .display-hero { font-size: 36px; line-height: 42px; }
}

@media (max-width: 480px) {
  .stat-row { grid-template-columns: repeat(2, 1fr); }
  .page-body { padding: var(--spacing-md); }
}

</style>
</head>

<script>
/**
 * Ibex Credit — shared interactivity
 * Vanilla JS, no dependencies.
 */

document.addEventListener('DOMContentLoaded', () => {
  initMobileNav();
  initDocumentUpload();
  initInputValidation();
});

/* --------------------------------------------------------------------
   Mobile nav: hamburger reveals the nav links as a stacked menu
   -------------------------------------------------------------------- */
function initMobileNav() {
  document.querySelectorAll('.nav-hamburger').forEach((btn) => {
    btn.addEventListener('click', () => {
      const nav = btn.closest('.nav');
      const links = nav.querySelector('.nav-links');
      const isOpen = links.classList.toggle('nav-links-open');
      btn.setAttribute('aria-expanded', String(isOpen));
    });
  });
}

/* --------------------------------------------------------------------
   Document Upload screen: Submit stays disabled until both required
   files are marked uploaded. Clicking "Choose file" simulates a
   successful upload (no real file picker wiring needed for a demo).
   -------------------------------------------------------------------- */
function initDocumentUpload() {
  const dropzones = document.querySelectorAll('[data-dropzone]');
  const submitBtn = document.querySelector('[data-submit-verification]');
  if (!dropzones.length || !submitBtn) return;

  const uploadedState = {};
  dropzones.forEach((zone) => {
    const key = zone.dataset.dropzone;
    uploadedState[key] = false;
    const button = zone.querySelector('button');
    button.addEventListener('click', () => {
      uploadedState[key] = true;
      renderUploadedFile(zone, key);
      updateSubmitState();
    });
  });

  function renderUploadedFile(zone, key) {
    zone.classList.add('dropzone-done');
    const status = zone.querySelector('[data-upload-status]');
    if (status) {
      status.textContent = '✓ Uploaded';
      status.classList.add('text-brand');
    }
  }

  function updateSubmitState() {
    const allUploaded = Object.values(uploadedState).every(Boolean);
    submitBtn.disabled = !allUploaded; // native :disabled styles handle the visual state
  }

  updateSubmitState();
}

/* --------------------------------------------------------------------
   Basic field validation feedback (required + email format) —
   purely visual, no network calls.
   -------------------------------------------------------------------- */
function initInputValidation() {
  document.querySelectorAll('form[data-validate]').forEach((form) => {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;
      form.querySelectorAll('[required]').forEach((input) => {
        const helper = input.closest('.field')?.querySelector('.field-helper');
        if (!input.value.trim()) {
          valid = false;
          input.classList.add('error');
          if (helper) { helper.textContent = 'This field is required.'; helper.classList.add('error'); }
        } else if (input.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value)) {
          valid = false;
          input.classList.add('error');
          if (helper) { helper.textContent = 'Enter a valid email address.'; helper.classList.add('error'); }
        } else {
          input.classList.remove('error');
          if (helper) helper.classList.remove('error');
        }
      });
      if (valid) {
        const redirect = form.dataset.redirect;
        if (redirect) window.location.href = redirect;
      }
    });
  });
}
